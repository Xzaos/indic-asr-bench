[project]
name = "asrbench"
version = "0.1.0"
description = "Indic ASR evaluation: normalisation-aware WER, cross-script matching, bootstrap CIs, LLM-WER with judge validation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "indic-transliteration>=2.3",
    "tqdm",
]

[project.optional-dependencies]
models = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.46,<5",
    "datasets>=2.20,<4",
    "soundfile",
    "httpx",
    "peft>=0.11",
]
dev = ["pytest"]

[project.scripts]
asrbench = "asrbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
